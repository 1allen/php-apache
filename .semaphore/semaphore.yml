version: v1.0
name: php-apache build pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: build image
    run:
      when: "pull_request =~ '^.+$' OR branch = 'latest'"
    task:
      env_vars:
        - name: CI_DOCKER_MODE
          value: build
      jobs:
        - name: docker build
          commands:
            - CI_GIT_BRANCH="${SEMAPHORE_GIT_BRANCH:-}" CI_GIT_TAG="${SEMAPHORE_GIT_TAG_NAME:-}" CI_GIT_REF_TYPE="${SEMAPHORE_GIT_REF_TYPE:-}" bash scripts/ci/docker_build.sh
  - name: verify release source
    run:
      when: "pull_request !~ '^.+$' AND (branch =~ '^php[0-9][0-9]$' OR tag =~ '^[0-9]+[.][0-9]+([.][0-9]+)?$')"
    task:
      env_vars:
        - name: CI_DOCKER_MODE
          value: preflight
      jobs:
        - name: release source preflight
          commands:
            - CI_GIT_BRANCH="${SEMAPHORE_GIT_BRANCH:-}" CI_GIT_TAG="${SEMAPHORE_GIT_TAG_NAME:-}" CI_GIT_REF_TYPE="${SEMAPHORE_GIT_REF_TYPE:-}" bash scripts/ci/docker_build.sh
promotions:
  - name: publish final image
    pipeline_file: publish.yml
    auto_promote:
      when: "result = 'passed' AND pull_request !~ '^.+$' AND tag =~ '^[0-9]+[.][0-9]+([.][0-9]+)?$'"
  - name: clean up retired Docker Hub tags
    pipeline_file: cleanup.yml
