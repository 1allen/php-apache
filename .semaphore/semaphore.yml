version: v1.0
name: php-apache semaphore ci
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
blocks:
  - name: build image
    dependencies: []
    skip:
      when: 'tag =~ ".+" OR branch =~ "^php[0-9][0-9]$"'
    task:
      jobs:
        - name: docker build
          commands:
            - checkout
            - CI_GIT_BRANCH="${SEMAPHORE_GIT_BRANCH:-}" CI_GIT_TAG="${SEMAPHORE_GIT_TAG_NAME:-}" CI_GIT_REF_TYPE="${SEMAPHORE_GIT_REF_TYPE:-}" CI_DOCKER_MODE=build bash scripts/ci/docker_build.sh
            - test ! -f .ci-image/php-apache.tar.gz || artifact push workflow .ci-image/php-apache.tar.gz
      env_vars:
        - name: DOCKER_USERNAME
          value: 1allen
        - name: IMAGE_NAME
          value: php-apache
        - name: DOCKER_BUILDKIT
          value: "1"
  - name: publish image
    dependencies: []
    skip:
      when: 'tag = "" AND branch !~ "^php[0-9][0-9]$"'
    task:
      jobs:
        - name: docker publish
          commands:
            - checkout
            - CI_GIT_BRANCH="${SEMAPHORE_GIT_BRANCH:-}" CI_GIT_TAG="${SEMAPHORE_GIT_TAG_NAME:-}" CI_GIT_REF_TYPE="${SEMAPHORE_GIT_REF_TYPE:-}" CI_DOCKER_MODE=build-publish bash scripts/ci/docker_build.sh
      secrets:
        - name: dockerhub-1allen
      env_vars:
        - name: DOCKER_USERNAME
          value: 1allen
        - name: IMAGE_NAME
          value: php-apache
        - name: DOCKER_BUILDKIT
          value: "1"
