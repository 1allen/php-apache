version: v1.0
name: php-apache semaphore ci
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
blocks:
  - name: build
    skip:
      when: "branch = 'master'"
    task:
      jobs:
        - name: docker build
          commands:
            - checkout
            - CI_GIT_BRANCH="${SEMAPHORE_GIT_BRANCH:-}" CI_GIT_TAG="${SEMAPHORE_GIT_TAG_NAME:-}" bash scripts/ci_docker_build.sh
      secrets:
        - name: dockerhub-1allen
      env_vars:
        - name: DOCKER_USERNAME
          value: 1allen
        - name: IMAGE_NAME
          value: php-apache
        - name: BUILDER_IMAGE
          value: spritsail/debian-builder:latest
        - name: DOCKER_BUILDKIT
          value: "1"
