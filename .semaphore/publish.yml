version: v1.0
name: php-apache publish pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: publish image
    dependencies: []
    task:
      env_vars:
        - name: CI_DOCKER_MODE
          value: build-publish
      jobs:
        - name: docker publish
          commands:
            - |
              export DOCKER_BUILDX_CACHE_DIR=.cache/docker-buildx
              cache_ref="${SEMAPHORE_GIT_BRANCH:-${SEMAPHORE_GIT_TAG_NAME:-detached}}"
              cache_ref="${cache_ref//[^A-Za-z0-9_.-]/-}"
              cache restore "docker-buildx-${cache_ref},docker-buildx-latest" || true
              CI_GIT_BRANCH="${SEMAPHORE_GIT_BRANCH:-}" CI_GIT_TAG="${SEMAPHORE_GIT_TAG_NAME:-}" CI_GIT_REF_TYPE="${SEMAPHORE_GIT_REF_TYPE:-}" bash scripts/ci/docker_build.sh
              cache store "docker-buildx-${cache_ref},docker-buildx-latest" "$DOCKER_BUILDX_CACHE_DIR" || true
      secrets:
        - name: dockerhub-1allen
  - name: scan published image
    dependencies:
      - publish image
    task:
      jobs:
        - name: trivy scan
          commands:
            - CI_GIT_BRANCH="${SEMAPHORE_GIT_BRANCH:-}" CI_GIT_TAG="${SEMAPHORE_GIT_TAG_NAME:-}" CI_GIT_REF_TYPE="${SEMAPHORE_GIT_REF_TYPE:-}" bash scripts/ci/trivy_scan.sh
