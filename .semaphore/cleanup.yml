version: v1.0
name: php-apache Docker Hub cleanup pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: delete retired Docker Hub tags
    dependencies: []
    task:
      jobs:
        - name: Docker Hub cleanup
          commands:
            - >-
              test "${SEMAPHORE_GIT_BRANCH:-}" = latest || {
                echo "Docker Hub cleanup must be promoted manually from a latest-branch workflow." >&2;
                exit 1;
              }
            - DOCKER_HUB_TOKEN="${DOCKER_PASSWORD:-}" bash scripts/docker_hub_cleanup.sh --apply
      secrets:
        - name: dockerhub-1allen
